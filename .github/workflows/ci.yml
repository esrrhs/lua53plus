name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            run_full_testes: true
          - os: macos-latest
            target: macosx
            run_full_testes: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build lua53plus (with internal lua_assert enabled)
        run: |
          make ${{ matrix.target }} MYCFLAGS='-DLUA_USE_APICHECK -include assert.h -Dlua_assert=assert'

      - name: Build tests/t_udata.so for GC fuzz userdata paths
        run: |
          make test-udata

      - name: Run language/stdlib e2e suite (with lua_assert)
        run: |
          ./src/lua tests/e2e/run_all.lua

      - name: Run randomized cross-generation GC fuzz suite (with lua_assert)
        env:
          FUZZ_OPS: "5000"
          FUZZ_REQUIRE_UDATA: "1"
        run: |
          ./src/lua tests/test_gc_fuzz.lua

      - name: Fetch official PUC-Lua 5.3.4 testes
        run: |
          ./scripts/fetch_testes.sh

      - name: Run official testes (basic _U=true)
        run: |
          make test-testes-basic

      - name: Rebuild with ltests + run complete official testes
        if: matrix.run_full_testes
        run: |
          ./scripts/build_with_ltests.sh ${{ matrix.target }}
          make test-testes

      - name: Rebuild clean release binaries
        run: |
          make clean
          make ${{ matrix.target }}
          ./src/lua -v
          ./src/luac -v

      - name: Build tests/t_udata.so (release)
        run: |
          make test-udata

      - name: Run language/stdlib e2e suite (release build)
        run: |
          ./src/lua tests/e2e/run_all.lua

      - name: Run randomized cross-generation GC fuzz suite (release build)
        env:
          FUZZ_OPS: "5000"
          FUZZ_REQUIRE_UDATA: "1"
        run: |
          ./src/lua tests/test_gc_fuzz.lua

      - name: Run official testes basic on release build
        run: |
          test -f testes/all.lua || ./scripts/fetch_testes.sh
          make test-testes-basic

      - name: Run benchmarks & manual-step large-heap simulation
        env:
          BENCH_RESIDENT_GROUPS: "20000"
          BENCH_TICKS_DEFAULT: "100000"
          BENCH_TICKS_LOWPAUSE: "100000"
          BENCH_N_DIRECT: "1000000"
          BENCH_N_LARGE: "10000"
          BENCH_N_OOP: "500000"
          BENCH_N_REHASH: "2000"
          BENCH_ENTITIES: "10000"
          BENCH_ROUNDS: "50000"
          BENCH_MANUAL_RECORDS: "60000"
          BENCH_MANUAL_TICKS: "12000"
        run: |
          ./src/lua bench/bench_gc_largeheap.lua
          ./src/lua bench/bench_gc_manualstep.lua
          ./src/lua bench/bench_table_lookup.lua
          ./src/lua bench/bench_mixed_workload.lua

  # AddressSanitizer + UndefinedBehaviorSanitizer (Ubuntu): catches heap
  # corruption / UB in GC fuzz and language e2e. Keeps existing jobs.
  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build lua53plus with ASan+UBSan
        run: |
          make linux MYCFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -DLUA_USE_APICHECK -include assert.h -Dlua_assert=assert' \
                     MYLDFLAGS='-fsanitize=address,undefined'

      - name: Build tests/t_udata.so with matching sanitizers
        run: |
          make test-udata TEST_UDATA_CFLAGS='-std=gnu99 -O1 -g -fPIC -Isrc -fsanitize=address,undefined -fno-omit-frame-pointer'
          # Shared object must also link sanitizer runtime when loaded into ASan binary
          gcc -std=gnu99 -O1 -g -fPIC -Isrc -fsanitize=address,undefined -fno-omit-frame-pointer \
              -shared -o tests/t_udata.so tests/t_udata.c

      - name: Run language/stdlib e2e suite (ASan)
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./src/lua tests/e2e/run_all.lua

      - name: Run GC fuzz suite (ASan, extra ops/seeds)
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          FUZZ_OPS: "6000"
          FUZZ_REQUIRE_UDATA: "1"
        run: |
          ./src/lua tests/test_gc_fuzz.lua

      - name: Fetch official testes and run basic suite (ASan)
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./scripts/fetch_testes.sh
          make test-testes-basic
